[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt3-from-scratch"
version = "0.1.0"
description = "A maintainable PyTorch implementation of the GPT-3 architecture"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7,<3",
    "numpy>=2,<3",
    "datasets>=4,<5",
    "tokenizers>=0.21,<1",
    "pydantic>=2.11,<3",
    "debugpy>=1.8.22",
]

[project.scripts]
gpt3-config = "gpt3.config:main"
gpt3-data = "gpt3.data.pipeline:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gpt3*"]

[tool.setuptools.package-data]
gpt3 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
